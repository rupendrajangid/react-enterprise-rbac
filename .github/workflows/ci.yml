name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm install -D @rollup/rollup-linux-x64-gnu

      - name: Build packages
        # Only build the core library packages for CI status
        run: npx turbo run build --filter="./packages/*"

      - name: Run tests
        run: npm run test
