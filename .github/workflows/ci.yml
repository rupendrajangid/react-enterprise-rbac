name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # Force fresh resolution on Linux to fix Rollup's optional native dependency bug
        # which occurs when the lockfile was generated on Windows.
        run: |
          rm -f package-lock.json
          npm install

      - name: Build packages
        run: npx turbo run build
